<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vudol</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --btn: #111827;
      --btn-hover: #000000;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.45;
      overflow-x: hidden;
    }

    /* HEADER */
    .appbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }

    .bar-inner {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      padding: 10px 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #111827;
      color: white;
      font-size: 14px;
    }

    /* CONTENT */
    .banner {
      width: 100%;
      max-width: 1200px;
      margin: 10px auto 0;
      padding: 8px 16px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .wrap {
      width: 100%;
      max-width: 1200px;
      margin: 6px auto 40px;
      padding: 0 16px;
    }

    .player-shell {
      display: grid;
      place-items: center;
      margin-top: 20px;
    }

    /* VIDEO */
    .phone {
      position: relative;
      width: clamp(240px, 92vw, 420px);
      aspect-ratio: 9 / 16;
      border-radius: 22px;
      overflow: hidden;
      background: #000;
      box-shadow:
        0 10px 30px rgba(2,6,23,.15),
        0 3px 10px rgba(2,6,23,.08);
    }

    .phone video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      background: #000;
    }

    .meta {
      width: 100%;
      max-width: 760px;
      margin: 22px auto 0;
      padding: 0 6px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    @media (min-width: 1024px) {
      .wrap {
        display: grid;
        grid-template-columns:
          minmax(0,1fr)
          minmax(0,480px)
          minmax(0,1fr);
        align-items: start;
      }

      .player-shell {
        grid-column: 2;
      }
    }

    @media (max-width: 480px) {
      .phone {
        width: 92vw;
        max-width: 420px;
      }
    }
  </style>
</head>

<body>

  <header class="appbar">
    <div class="bar-inner">
      <div class="brand">
        <span class="logo">V</span>
        <span>Vudol</span>
      </div>
    </div>
  </header>

  <div class="banner">
    Selamat menonton
  </div>

  <main class="wrap">

    <section class="player-shell">

      <div class="phone">

        <video
          controls
          playsinline
          preload="metadata"
          width="100%"
          height="100%"
        >
          <!-- video -->
          <source
            src="./kanjut/VID-20260813-WA0007.mp4"
            type="video/mp4"
          >

          Browser Anda tidak mendukung pemutar video.
        </video>

      </div>

    </section>

    <div class="meta">
      Video
    </div>

  </main>

</body>
</html>
