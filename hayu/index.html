<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>RUDALSAEPUDIN</title>

  <style>
    :root {
      --bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --btn: #111827;
      --btnHover: #000000;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Inter,
        system-ui,
        -apple-system,
        "Segoe UI",
        Roboto,
        Ubuntu,
        "Helvetica Neue",
        Arial,
        sans-serif;

      color: var(--text);
      background: var(--bg);
      line-height: 1.45;
      overflow-x: hidden;
    }

    video {
      max-width: 100%;
      display: block;
    }

    /* APP BAR */

    .appbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,255,255,.85);
      backdrop-filter: saturate(180%) blur(8px);
      border-bottom: 1px solid var(--line);
    }

    .bar-inner {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      padding: 10px 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #111827;
      color: #fff;
      font-size: 14px;
    }

    /* LAYOUT */

    .wrap {
      width: 100%;
      max-width: 1200px;
      margin: 6px auto 40px;
      padding: 0 16px;
    }

    .player-shell {
      display: grid;
      place-items: center;
      margin-top: 20px;
    }

    /* VIDEO */

    .phone {
      width: clamp(240px, 92vw, 420px);
      aspect-ratio: 9 / 16;
      border-radius: 22px;
      overflow: hidden;
      background: #000;
      box-shadow:
        0 10px 30px rgba(2,6,23,.15),
        0 3px 10px rgba(2,6,23,.08);
    }

    .phone video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* CONTROLS */

    .controls {
      width: clamp(240px, 92vw, 420px);
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-btn {
      border: 0;
      border-radius: 10px;
      background: var(--btn);
      color: #fff;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .control-btn:hover {
      background: var(--btnHover);
    }

    #progress {
      flex: 1;
      height: 6px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
      cursor: pointer;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: #111827;
    }

    #volume {
      width: 70px;
    }

    /* DIRECT LINK */

    .direct-link {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 18px;
      border-radius: 10px;
      background: #111827;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }

    .direct-link:hover {
      background: #000;
    }

    .meta {
      width: 100%;
      max-width: 760px;
      margin: 22px auto 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    @media (min-width: 1024px) {
      .wrap {
        display: grid;
        grid-template-columns:
          minmax(0, 1fr)
          minmax(0, 480px)
          minmax(0, 1fr);
      }

      .player-shell {
        grid-column: 2;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="appbar">
    <div class="bar-inner">
      <div class="brand">
        <span class="logo">V</span>
        <span>RUDALSAEPUDIN</span>
      </div>
    </div>
  </header>


  <!-- CONTENT -->

  <main class="wrap">

    <section class="player-shell">

      <!-- VIDEO -->

      <div class="phone">

        <video
          id="video"
          playsinline
          preload="metadata"
        >
          <source
            src="VID-20260813-WA0003.mp4"
            type="video/mp4"
          >

          Browser kamu tidak mendukung video.
        </video>

      </div>


      <!-- VIDEO CONTROLS -->

      <div class="controls">

        <button
          id="playBtn"
          class="control-btn"
          type="button"
        >
          <span id="playIcon">▶</span>
          <span id="playText">Play</span>
        </button>


        <div id="progress">
          <div id="progressBar"></div>
        </div>


        <input
          id="volume"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="1"
          aria-label="Volume"
        >


        <button
          id="fullscreenBtn"
          class="control-btn"
          type="button"
        >
          ⛶
        </button>

      </div>


      <!-- DIRECT LINK -->

      <a
        class="direct-link"
        href="https://bony-teaching.com/jLprYt"
        target="_blank"
        rel="noopener noreferrer"
      >
        Buka
      </a>

    </section>


    <div class="meta">
      Video
    </div>

  </main>


  <!-- VIDEO JAVASCRIPT -->

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const video = document.getElementById("video");
      const playBtn = document.getElementById("playBtn");
      const playIcon = document.getElementById("playIcon");
      const playText = document.getElementById("playText");
      const progress = document.getElementById("progress");
      const progressBar = document.getElementById("progressBar");
      const volume = document.getElementById("volume");
      const fullscreenBtn =
        document.getElementById("fullscreenBtn");


      function updatePlayButton() {

        if (video.paused) {
          playIcon.textContent = "▶";
          playText.textContent = "Play";
        } else {
          playIcon.textContent = "❚❚";
          playText.textContent = "Pause";
        }

      }


      playBtn.addEventListener("click", async () => {

        try {

          if (video.paused) {
            await video.play();
          } else {
            video.pause();
          }

        } catch (error) {
          console.log(
            "Video tidak dapat diputar:",
            error
          );
        }

        updatePlayButton();

      });


      video.addEventListener(
        "play",
        updatePlayButton
      );

      video.addEventListener(
        "pause",
        updatePlayButton
      );


      /* PROGRESS */

      video.addEventListener(
        "timeupdate",
        () => {

          if (!video.duration) return;

          const percent =
            (video.currentTime /
              video.duration) * 100;

          progressBar.style.width =
            percent + "%";

        }
      );


      progress.addEventListener(
        "click",
        (event) => {

          if (!video.duration) return;

          const rect =
            progress.getBoundingClientRect();

          const position =
            (event.clientX - rect.left) /
            rect.width;

          video.currentTime =
            position * video.duration;

        }
      );


      /* VOLUME */

      volume.addEventListener(
        "input",
        () => {
          video.volume = volume.value;
        }
      );


      /* FULLSCREEN */

      fullscreenBtn.addEventListener(
        "click",
        async () => {

          try {

            if (!document.fullscreenElement) {
              await video.requestFullscreen();
            } else {
              await document.exitFullscreen();
            }

          } catch (error) {

            console.log(
              "Fullscreen tidak tersedia."
            );

          }

        }
      );


      updatePlayButton();

    });
  </script>

  </script>

</body>
</html>
