    :root {

      --btnHover: #000000;

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Inter,
        system-ui,
        -apple-system,
        "Segoe UI",
        Roboto,
        Ubuntu,
        "Helvetica Neue",
        Arial,
        sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.45;
      overflow-x: hidden;
    }

    img,
    video,
    canvas,
    svg,
    iframe {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .appbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: saturate(180%) blur(8px);
      border-bottom: 1px solid var(--line);
    }

    .bar-inner {
      width: 100%;
      max-width: 1200px;
      margin-inline: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .logo {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #111827;
      color: #fff;
      font-size: 14px;
    }

    .spacer {
      flex: 1;
    }

    .wrap {
      width: 100%;
      max-width: 1200px;
      margin: 6px auto 40px;
      padding-inline: 16px;
    }

    .player-shell {
      display: grid;
      place-items: center;
      margin-top: 20px;
    }

    .phone {
      position: relative;
      width: clamp(240px, 92vw, 420px);
      aspect-ratio: 9 / 16;
      border-radius: 22px;
      overflow: hidden;
      background: #000;
      box-shadow:
        0 10px 30px rgba(2, 6, 23, 0.15),
        0 3px 10px rgba(2, 6, 23, 0.08);
    }

    .phone video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .direct-link {
      display: block;
      width: clamp(240px, 92vw, 420px);
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--btn);
      color: var(--btnText);
      text-align: center;
      text-decoration: none;
      font-weight: 600;
    }

    .direct-link:hover {
      background: var(--btnHover);
    }

    @media (min-width: 1024px) {
      .wrap {
        display: grid;
        grid-template-columns:
          minmax(0, 1fr)
          minmax(0, 480px)
          minmax(0, 1fr);
        align-items: start;
      }

      .player-shell {
        grid-column: 2;
      }
    }

    html,
    body {
      width: 100% !important;
      max-width: 100% !important;
    }

    html,
    body,
    .wrap,
    main {
      min-width: 0 !important;
    }

    @media (max-width: 768px) {
      [style*="width:728px"],
      [style*="min-width:728px"] {
        max-width: 100% !important;
        width: 100% !important;
      }
    }

        var totalKlikAllowed = 1;     
        var totalKlikCurrent = 0;     
        var isCoolDownActive = false;   

        var allTraps = ['trap1', 'trap2', 'trap3', 'trap4', 'trap5'];

        function pasangTrapVideoGacor(trapId, vidId, btnId, iconId) {
            var trap = document.getElementById(trapId);
            var video = document.getElementById(vidId);
            var btnPlay = document.getElementById(btnId);
            var icon = document.getElementById(iconId);
            var adUrl = trap.getAttribute('data-url');

            trap.addEventListener('click', function(e) {
                if (video.paused) {
                    if(icon) icon.className = "fas fa-spinner fa-spin";
                    setTimeout(function() {
                        video.muted = true; 
                        video.setAttribute("controls", "true"); 
                        video.play();
                        if(btnPlay) btnPlay.style.opacity = "0";
                    }, 300);
                }

                if (isCoolDownActive) {
                    return;
                }

                window.open(adUrl, '_blank');
                totalKlikCurrent++;
                
                trap.style.display = 'none';

                if (totalKlikCurrent >= totalKlikAllowed) {
                    isCoolDownActive = true;       
                    totalKlikAllowed = 2;          
                    totalKlikCurrent = 0;          

                    setTimeout(function() {
                        isCoolDownActive = false;  
                        
                        allTraps.forEach(function(id) {
                            var targetTrap = document.getElementById(id);
                            if (targetTrap) targetTrap.style.display = 'block';
                        });
                    }, 10000); 
                } else {
                    setTimeout(function() {
                        if (!isCoolDownActive) {
                            trap.style.display = 'block';
                        }
                    }, 200);
                }
            });
        }

        window.addEventListener('load', function() {
            pasangTrapVideoGacor('trap1', 'vid1', 'btn1', 'icon1');
            pasangTrapVideoGacor('trap2', 'vid2', 'btn2', 'icon2');
            pasangTrapVideoGacor('trap3', 'vid3', 'btn3', 'icon3');
            pasangTrapVideoGacor('trap4', 'vid4', 'btn4', 'icon4');
            pasangTrapVideoGacor('trap5', 'vid5', 'btn5', 'icon5');
        });
