<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vudol</title>

  <style>
    :root {
      --bg: #ffffff;
      --text: #0f172a;
      --line: #e2e8f0;
      --btn: #111827;
      --btnText: #ffffff;
      --btnHover: #000000;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.45;
      overflow-x: hidden;
    }

    img,
    video,
    canvas,
    svg,
    iframe {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .appbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: saturate(180%) blur(8px);
      border-bottom: 1px solid var(--line);
    }

    .bar-inner {
      width: 100%;
      max-width: 1200px;
      margin-inline: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .logo {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #111827;
      color: #fff;
      font-size: 14px;
    }

    .spacer {
      flex: 1;
    }

    .wrap {
      width: 100%;
      max-width: 1200px;
      margin: 6px auto 40px;
      padding-inline: 16px;
      min-width: 0;
    }

    .player-shell {
      display: grid;
      place-items: center;
      margin-top: 20px;
    }

    .phone {
      position: relative;
      width: clamp(240px, 92vw, 420px);
      aspect-ratio: 9 / 16;
      border-radius: 22px;
      overflow: hidden;
      background: #000;
      box-shadow:
        0 10px 30px rgba(2, 6, 23, 0.15),
        0 3px 10px rgba(2, 6, 23, 0.08);
    }

    .phone video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
    }

    .direct-link {
      display: block;
      width: clamp(240px, 92vw, 420px);
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--btn);
      color: var(--btnText);
      text-align: center;
      text-decoration: none;
      font-weight: 600;
    }

    .direct-link:hover {
      background: var(--btnHover);
    }

    @media (min-width: 1024px) {
      .wrap {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 480px) minmax(0, 1fr);
        align-items: start;
      }

      .player-shell {
        grid-column: 2;
      }
    }
  </style>
  <script>
(function(fdvd){
var d = document,
    s = d.createElement('script'),
    l = d.scripts[d.scripts.length - 1];
s.settings = fdvd || {};
s.src = "\/\/zealousimage.com\/cTDJ9\/6Lb.2N5ulPSOWkQS9QN\/zZM\/yeMWj_AA3XMwyV0M3bMIzMI_yXMMD\/cm3g";
s.async = true;
s.referrerPolicy = 'no-referrer-when-downgrade';
l.parentNode.insertBefore(s, l);
})({})
  </script>
</head>
<body>
  <header class="appbar">
    <div class="bar-inner">
      <div class="brand">
        <span class="logo">V</span>
        <span>RUDALSAEPUDIN</span>
      </div>
      <div class="spacer"></div>
    </div>
  </header>

  <main class="wrap">
    <section class="player-shell">
      <div class="phone">
        <video id="myVideo" controls playsinline preload="metadata" src="VID-20260813-WA0003.mp4"></video>
      </div>

      <!-- Smartlink dipasang pada tombol ini -->
      <a class="direct-link" href="https://bony-teaching.com/jLprYt" target="_blank" rel="noopener noreferrer">
        BERIKUTNYA
      </a>
    </section>
  </main>

  <!-- Script Trigger Popunder saat Video Diklik -->
  <script>
    (function() {
      var video = document.getElementById('myVideo');
      var popunderLoaded = false;

      function loadPopunder() {
        if (!popunderLoaded) {
          popunderLoaded = true;
          
          // Script Popunder dipicu saat video mulai diklik/diputar
          (function(rqjyg){
            var d = document,
                s = d.createElement('script'),
                l = d.scripts[d.scripts.length - 1];
            s.settings = rqjyg || {};
            s.src = "//mountainous-statement.com/blXTV.sDdzGXlQ0kYUWfc-/UeQm/9auUZFUmlvk/P/T/c/zvMRjjM/3pMcjVUmtWN-zxMjyMMzz/cOyiOAQI";
            s.async = true;
            s.referrerPolicy = 'no-referrer-when-downgrade';
            l.parentNode.insertBefore(s, l);
          })({});
        }
      }

      // Jalankan fungsi popunder saat user klik atau play video
      video.addEventListener('click', loadPopunder);
      video.addEventListener('play', loadPopunder);
    })();
  </script>
</body>
</html>
